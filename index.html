<script>
/* Reads content.txt and lays it out for the collage script below. You don't need to edit this file. */
(function () {
  var IMG = /\.(jpe?g|png|gif|webp|avif)$/i;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  fetch('content.txt', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (txt) {
    var text = [], work = '';
    txt.replace(/\r/g, '').split('\n').forEach(function (raw) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;
      if (/^note\s*\|/i.test(line)) { work += '<div class="note">' + esc(line) + '</div>'; return; }
      var bar = line.indexOf('|'), file = bar > 0 ? line.slice(0, bar).trim() : '';
      if (file && IMG.test(file)) {
        var src = file.indexOf('/') >= 0 ? file : 'images/' + file;
        work += '<figure><img src="' + esc(encodeURI(src)) + '" alt=""><figcaption class="caption">' + esc(line.slice(bar + 1).trim()) + '</figcaption></figure>';
        return;
      }
      text.push(esc(line));
    });
    document.getElementById('content').innerHTML = '<div class="sitetext">' + text.join('<br>') + '</div>' + work;
  });
})();
</script>

(function () {
  if (window.__driftLoaded) return; window.__driftLoaded = true;

  /* ---------- texts written on the Cargo page override the defaults above ----------
     Put a text block on the page that starts with "Headline:" and write one item per line:
     Headline: Aleksandr® / Promo design / Yerevan, ARM
     About: (one or more paragraphs on the following lines)
     Tagline 1 / Tagline 2 / Stamp outer / Stamp inner / Background words / Email / Index note */
  var LABELS = {
    'headline': 'headline', 'about': 'about', 'about link': 'aboutLink', 'tagline 1': 'taglineA', 'tagline 2': 'taglineB',
    'background words': 'backgroundWords', 'stamp outer': 'stampOuter', 'stamp inner': 'stampInner', 'email': 'email',
    'work label': 'workLabel', 'contact label': 'contactLabel', 'index title': 'indexTitle', 'index note': 'indexNote',
    'contact lines': 'contactLines', 'contact note': 'contactNote'
  };
  var labelRe = new RegExp('^\\s*(' + Object.keys(LABELS).join('|') + ')\\s*:\\s*(.*)$', 'i');
  function deepFindText(root) {
    var best = null, all = root.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.id === 'drift' || el.closest && el.closest('#drift')) continue;
      if (el.shadowRoot) { var s = deepFindText(el.shadowRoot); if (s && (!best || s.textContent.length < best.textContent.length)) best = s; }
      if (/SCRIPT|STYLE|TEMPLATE/.test(el.tagName)) continue;
      var t = el.textContent || '';
      if (/^\s*headline\s*:/i.test(t) && (!best || t.length < best.textContent.length)) best = el;
    }
    return best;
  }
  function readPageText() {
    var el = deepFindText(document.body);
    var out = JSON.parse(JSON.stringify(BASE));
    if (!el) return out;
    var lines = (el.innerText || el.textContent || '').split(/\n/), key = null, buf = {};
    lines.forEach(function (raw) {
      var line = raw.replace(/ /g, ' ').trim(), m = line.match(labelRe);
      if (m) { key = LABELS[m[1].toLowerCase()]; buf[key] = m[2] ? [m[2].trim()] : []; return; }
      if (key && line) buf[key].push(line);
    });
    Object.keys(buf).forEach(function (k) {
      if (!buf[k].length) return;
      if (k === 'headline') out.headline = buf[k].join(' / ').split('/').map(function (s) { return s.trim(); }).filter(Boolean);
      else if (k === 'about') out.about = buf[k].join('\n\n');
      else if (k === 'taglineA' || k === 'taglineB') out[k] = buf[k].join(' ').split('/').map(function (s) { return s.trim(); }).join('\n');
      else if (k === 'contactLines') out.contactLines = buf[k].join(' / ').split(/\s+\/\s+/).map(function (s) { return s.trim(); }).filter(Boolean);
      else out[k] = buf[k].join(' ');
    });
    return out;
  }
  var inEditor = (function () {
    try { if (window.self !== window.top) return true; } catch (e) { return true; }
    return !!document.querySelector('[contenteditable="true"]');
  })();
  var disabled = /[?&]nocollage\b/.test(location.search);

  function onTargetPage() {
    if (inEditor || window.DRIFT_STANDALONE) return true;
    var p = location.pathname.replace(/\/+$/, '').toLowerCase();
    if (!S.page) return p === '' || p === '/';
    return p.split('/').pop() === String(S.page).toLowerCase().replace(/\s+/g, '-');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- read images + captions from the Cargo page (also inside shadow roots) ---------- */
  function deepImgs(root, out) {
    var all = root.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.id === 'drift' || el.id === 'drift-toggle') continue;

        p.el = host || img;

    return projects;
  }
  /* Text notes: any text block on the page that starts with "Note |"  ->  Note | Group | Heading | Text */
  function findNotes(projects) {
    var found = [], all = document.body.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (/SCRIPT|STYLE|TEMPLATE/.test(el.tagName) || (el.closest && el.closest('#drift'))) continue;

      var kids = el.children, inner = false;
      for (var k = 0; k < kids.length; k++) if (/^note\s*\|/i.test((kids[k].textContent || '').trim())) { inner = true; break; }
      if (inner) continue;
      var parts = t.split('|').map(function (x) { return x.trim(); });
      var n = { category: parts[1] || 'Work', heading: parts[2] || '', body: parts.slice(3).join(' | '), before: null };
      for (var j = 0; j < projects.length; j++) {

      }
